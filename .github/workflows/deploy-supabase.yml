name: Deploy Supabase Edge Functions

# Déploie automatiquement toutes les Edge Functions vers le projet Supabase
# personnel pcjhrmwuqyxddyeikely, sans dépendre de la CLI locale.
#
# Secrets requis dans GitHub → Settings → Secrets and variables → Actions :
#   - SUPABASE_ACCESS_TOKEN  (https://supabase.com/dashboard/account/tokens)
#   - SUPABASE_PROJECT_REF   = pcjhrmwuqyxddyeikely
#   - SUPABASE_DB_PASSWORD   (mot de passe DB du projet, pour `db push` optionnel)
#
# Secrets à définir côté Supabase (Dashboard → Project Settings → Edge Functions) :
#   - LOVABLE_API_KEY, GOOGLE_SEARCH_API_KEY, GOOGLE_SEARCH_ENGINE_ID,
#     ABEL_CV_URL, OPPORTUNITY_ADMIN_TOKEN
#   (SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY / SUPABASE_ANON_KEY sont injectés
#    automatiquement par Supabase dans les Edge Functions.)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify project ref
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "❌ SUPABASE_PROJECT_REF secret is missing" && exit 1
          fi
          echo "Deploying to project: $SUPABASE_PROJECT_REF"

      - name: Deploy Edge Functions
        run: |
          set -e
          for fn in \
            generate-sitemap \
            generate-blog-post \
            generate-batch-posts \
            mcp \
            discover-job-opportunities \
            score-job-opportunities \
            draft-job-outreach \
            manage-opportunities \
            run-opportunity-daily
          do
            echo "▶ Deploying $fn"
            supabase functions deploy "$fn" \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --no-verify-jwt=$([ "$fn" = "generate-sitemap" ] || [ "$fn" = "mcp" ] && echo true || echo false) \
              || exit 1
          done
          echo "✅ All functions deployed"
