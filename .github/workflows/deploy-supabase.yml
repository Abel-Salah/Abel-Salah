name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify project ref
        run: |
          set -e
          test -n "$SUPABASE_PROJECT_REF"
          echo "Deploying to project: $SUPABASE_PROJECT_REF"

      - name: Deploy all Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for dir in supabase/functions/*; do
            if [ -f "$dir/index.ts" ]; then
              fn="$(basename "$dir")"
              echo "▶ Deploying $fn"
              if [ "$fn" = "generate-sitemap" ] || [ "$fn" = "mcp" ]; then
                supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
              else
                supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
              fi
            fi
          done
          echo "✅ All Edge Functions deployed"
